<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links</title>
  </head>
  <body>
    <header>
      <h1>links.mikejeff.com</h1>
    </header>

    <h2>Links</h2>
    <ul>
      <li><a href="https://www.mikejeff.com">mikejeff.com</a></li>
      <li><a href="https://bsky.app/profile/mikejeff.com">Bluesky</a></li>
    </ul>
  </body>

  <style>
    :root {
      color-scheme: light dark;

      --blue-d: oklch(0.7 0.17 264.1);
      --blue-l: oklch(0.48 0.31 264.1);
      --purple-d: oklch(0.71 0.2 302.1);
      --purple-l: oklch(0.49 0.27 302.1);
      --red-d: oklch(0.72 0.23 29.2);
      --red-l: oklch(0.48 0.22 29.2);

      --dark-bg: hsl(0deg 0% 5.1%);
      --dark-fg: hsl(0deg 0% 100%);
      --light-bg: hsl(0deg 0% 98.04%);
      --light-fg: hsl(0deg 0% 0%);
    }

    html {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        avenir next,
        avenir,
        segoe ui,
        helvetica neue,
        Adwaita Sans,
        Cantarell,
        Ubuntu,
        roboto,
        noto,
        helvetica,
        arial,
        sans-serif;
    }

    a {
      color: light-dark(var(--blue-l), var(--blue-d));
    }

    a:visited {
      color: light-dark(var(--purple-l), var(--purple-d));
    }

    a:hover {
      text-decoration: none;
    }

    a:active {
      color: light-dark(var(--red-l), var(--red-d));
    }

    body {
      color: light-dark(var(--light-fg), var(--dark-fg));
      background-color: light-dark(var(--light-bg), var(--dark-bg));
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      letter-spacing: 0.5px;
    }
  </style>
</html>
